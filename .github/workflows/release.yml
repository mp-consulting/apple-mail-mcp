name: Release

# Publishing a GitHub release builds Apple Mail MCP (universal), signs it with a Developer ID certificate,
# and attaches two notarized files to the release: AppleMailMCP-<version>.dmg (the app) and
# AppleMailMCP-<version>.mcpb (the Claude app extension, also signed for Claude). It then lists the
# version in the MCP registry. The version comes from the release tag (v1.2.0 -> 1.2.0). Secrets are
# listed in CLAUDE.md under "Releases"; the Homebrew tap picks the release up on its own schedule.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write  # MCP registry login (GitHub OIDC)

jobs:
  dmg:
    # macOS 26 and its Xcode: the menu bar app uses the Liquid Glass APIs and Swift 6.2.
    runs-on: macos-26
    env:
      TAG: ${{ github.event.release.tag_name }}
      # Notarization is skipped when the key is missing; the DMG is then signed only. Only whether it
      # is set lives here: the key itself is given to the one step that uses it, not to the tests.
      NOTARIZE: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      # Pinned to a commit: a moved tag must not run in a job that holds the signing certificate.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          trap 'rm -f "$RUNNER_TEMP/certificate.p12"' EXIT
          (umask 077 && echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12")
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE holds no Developer ID Application identity"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: VERSION="${TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" Scripts/build-app.sh

      - name: Make disk image
        run: |
          DMG="$HOME/Library/Caches/AppleMailMCP/dist/AppleMailMCP-${TAG#v}.dmg"
          Scripts/make-dmg.sh "$HOME/Library/Caches/AppleMailMCP/dist/Apple Mail MCP.app" "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.NOTARIZE == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          trap 'rm -f "$KEY"' EXIT
          (umask 077 && printf '%s\n' "$APPLE_API_KEY" > "$KEY")
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: Attach disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$DMG" --clobber

      - name: Make Claude extension
        run: |
          MCPB="$HOME/Library/Caches/AppleMailMCP/dist/AppleMailMCP-${TAG#v}.mcpb"
          Scripts/make-mcpb.sh "$HOME/Library/Caches/AppleMailMCP/dist/Apple Mail MCP.app" "$MCPB"
          echo "MCPB=$MCPB" >> "$GITHUB_ENV"

      # The .mcpb is a zip: notarizing it notarizes the server binary inside (checked online, a zip
      # can't be stapled). This runs before signing, which appends Claude's signature to the zip.
      - name: Notarize Claude extension
        if: env.NOTARIZE == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          ZIP="$RUNNER_TEMP/extension.zip"
          trap 'rm -f "$KEY" "$ZIP"' EXIT
          (umask 077 && printf '%s\n' "$APPLE_API_KEY" > "$KEY")
          cp "$MCPB" "$ZIP"
          xcrun notarytool submit "$ZIP" --key "$KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait

      # Signs the bundle for Claude with the same Developer ID: certificate and key from the .p12,
      # plus Apple's Developer ID intermediates, so Claude shows a verified publisher.
      - name: Sign Claude extension
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          WORK="$RUNNER_TEMP/mcpb-sign"
          mkdir -p "$WORK"
          trap 'rm -rf "$WORK"' EXIT
          (umask 077 && echo "$CERTIFICATE" | base64 --decode > "$WORK/id.p12")
          pem() {
            /usr/bin/openssl pkcs12 -in "$WORK/id.p12" -passin env:CERTIFICATE_PASSWORD "$@" 2>/dev/null \
              || openssl pkcs12 -legacy -in "$WORK/id.p12" -passin env:CERTIFICATE_PASSWORD "$@"
          }
          # The .p12 can hold several identities (Application and Installer): keep the Developer ID
          # Application certificate and the key with the same localKeyID.
          (umask 077 && pem -nodes -out "$WORK/all.pem")
          python3 - "$WORK" <<'PY'
          import re, sys
          work = sys.argv[1]
          text = open(f"{work}/all.pem").read()
          blocks = re.findall(r"(Bag Attributes.*?-----END [A-Z ]+-----)", text, re.S)
          def key_id(block):
              m = re.search(r"localKeyID:\s*([0-9A-F ]+)", block)
              return m.group(1).strip() if m else None
          certs = [b for b in blocks if "BEGIN CERTIFICATE" in b and "Developer ID Application" in b]
          if not certs:
              sys.exit("no Developer ID Application certificate in the .p12")
          cert = certs[0]
          keys = [b for b in blocks if "PRIVATE KEY" in b and key_id(b) == key_id(cert)]
          if not keys:
              sys.exit("no private key matching the Developer ID Application certificate")
          strip = lambda b: b[b.index("-----BEGIN"):] + "\n"
          open(f"{work}/cert.pem", "w").write(strip(cert))
          open(f"{work}/key.pem", "w").write(strip(keys[0]))
          PY
          rm -f "$WORK/all.pem"
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$WORK/$ca.cer"
            /usr/bin/openssl x509 -inform DER -in "$WORK/$ca.cer" -out "$WORK/$ca.pem"
          done
          npx --yes @anthropic-ai/mcpb@2.1.2 sign "$MCPB" --cert "$WORK/cert.pem" --key "$WORK/key.pem" \
            --intermediate "$WORK/DeveloperIDG2CA.pem" "$WORK/DeveloperIDCA.pem"
          # `mcpb verify` reports every file as unsigned (node-forge cannot verify PKCS#7), so check
          # the signature with OpenSSL against Apple's root instead.
          curl -fsSL "https://www.apple.com/appleca/AppleIncRootCertificate.cer" -o "$WORK/AppleRootCA.cer"
          /usr/bin/openssl x509 -inform DER -in "$WORK/AppleRootCA.cer" -out "$WORK/AppleRootCA.pem"
          Scripts/verify-mcpb.sh "$MCPB" "$WORK/AppleRootCA.pem" "$SIGN_IDENTITY"

      - name: Attach Claude extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$MCPB" --clobber

      - name: Publish to the MCP registry
        run: |
          VERSION="${TAG#v}"
          SHA256="$(shasum -a 256 "$MCPB" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__SHA256__/$SHA256/" server.json > "$RUNNER_TEMP/server.json"
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_darwin_arm64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Remove keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
