name: CI

# Tests and builds every push to main and every pull request. The release workflow tests again
# before it signs anything.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 26 and its Xcode: the menu bar app uses the Liquid Glass APIs and Swift 6.2.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the newest Xcode on the runner
        # The image's default can lag behind; local builds use the current Xcode, so CI should too.
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Skills are embedded
        run: |
          Scripts/embed-skills.sh
          git diff --exit-code Sources/MailMCPKit/SkillCatalog+Generated.swift

      - name: Test
        run: swift test

      - name: Build
        run: swift build -c release --arch arm64

      - name: Benchmark (synthetic mailbox, no personal data)
        run: .build/arm64-apple-macosx/release/mail-bench synthetic --messages 20000 --runs 5 >> "$GITHUB_STEP_SUMMARY"

  linux:
    # The Dockerfile Glama builds to read the tools: the server must keep compiling on Linux (demo mailbox only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t apple-mail-mcp .

      - name: The server lists its tools
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | { cat; sleep 2; } | docker run --rm -i apple-mail-mcp | grep -q '"name":"search_messages"'
